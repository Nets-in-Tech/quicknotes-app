<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Simple and lightweight note management</p>
    </header>

    <main>
        <!-- Section 1: Add a note -->
        <section class="card-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Content:</label>
                    <input type="text" id="note-input" placeholder="Type your note here (max 200 chars)...">
                </div>
                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>
                <button type="submit" id="add-btn">Add Note</button>
            </form>
            <p id="error-message" role="alert"></p>
        </section>

        <!-- Section 2: Your notes -->
        <section class="card-section">
            <h2>Your notes</h2>
            <div class="controls-container">
                <div class="search-group">
                    <label for="search-input" class="sr-only">Search notes:</label>
                    <input type="text" id="search-input" placeholder="Search notes...">
                </div>
                <button id="clear-all-btn" type="button" class="btn-danger">Clear All</button>
            </div>

            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
</body>

</html>
